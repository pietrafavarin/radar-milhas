name: Radar de Milhas

on:
  schedule:
    # 7h, 12h e 19h no horário de Brasília (UTC-3)
    - cron: "0 10 * * *"
    - cron: "0 15 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:   # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes do extrator
        run: python -m unittest discover -s tests -q
      - name: Coletar e analisar
        run: python run.py --paginas 3
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERTA_DESCONTO_MIN: ${{ vars.ALERTA_DESCONTO_MIN || '10' }}
          ALERTA_SO_SP: ${{ vars.ALERTA_SO_SP || '1' }}
      - name: Salvar resultado
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/posts.json docs/data.json
          [ -f data/alertados.json ] && git add data/alertados.json
          git diff --cached --quiet || git commit -m "Radar: atualização $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
